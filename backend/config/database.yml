default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: portfolio_development
  username: postgres
  password: postgres
  host: localhost
  port: 5432

test:
  <<: *default
  database: portfolio_test
  username: postgres
  password: postgres
  host: localhost
  port: 5432

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  sslmode: require
  prepared_statements: false