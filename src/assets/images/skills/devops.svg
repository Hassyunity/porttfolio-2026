<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#fff" stroke-opacity=".05"/></pattern>
    <radialGradient id="glow" cx="50%" cy="30%" r="55%"><stop offset="0" stop-color="#f0444b" stop-opacity=".35"/><stop offset="1" stop-color="#f0444b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="600" height="420" fill="#0d0d10"/>
  <rect width="600" height="420" fill="url(#g)"/>
  <rect width="600" height="420" fill="url(#glow)"/>

  <!-- Nuage -->
  <path d="M210 150c-26 0-46-19-46-43 0-23 18-41 41-43 8-27 33-46 63-46 30 0 56 20 63 48 4-1 8-1 12-1 30 0 54 23 54 52s-24 33-54 33z" transform="translate(0 20)" fill="#16161a" stroke="#f0444b" stroke-opacity=".75" stroke-width="2"/>
  <g transform="translate(270 92)" stroke="#fff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 34V6M18 18L30 6l12 12"/>
  </g>

  <!-- Flèches vers les conteneurs -->
  <g stroke="#fff" stroke-opacity=".2" stroke-width="2">
    <path d="M300 172v30M300 202H170v18M300 202h130v18M300 202v18"/>
  </g>

  <!-- Conteneurs -->
  <g>
    <g transform="translate(120 222)">
      <rect width="100" height="62" rx="8" fill="#16161a" stroke="#fff" stroke-opacity=".22"/>
      <path d="M20 14v34M36 14v34M52 14v34M68 14v34M84 14v34" stroke="#fff" stroke-opacity=".12" stroke-width="4"/>
      <circle cx="88" cy="12" r="4" fill="#f0444b"/>
    </g>
    <g transform="translate(250 222)">
      <rect width="100" height="62" rx="8" fill="#16161a" stroke="#f0444b" stroke-opacity=".6"/>
      <path d="M20 14v34M36 14v34M52 14v34M68 14v34M84 14v34" stroke="#f0444b" stroke-opacity=".3" stroke-width="4"/>
      <circle cx="88" cy="12" r="4" fill="#f0444b"/>
    </g>
    <g transform="translate(380 222)">
      <rect width="100" height="62" rx="8" fill="#16161a" stroke="#fff" stroke-opacity=".22"/>
      <path d="M20 14v34M36 14v34M52 14v34M68 14v34M84 14v34" stroke="#fff" stroke-opacity=".12" stroke-width="4"/>
      <circle cx="88" cy="12" r="4" fill="#f0444b"/>
    </g>
  </g>

  <!-- Pipeline CI/CD -->
  <g transform="translate(90 330)">
    <path d="M24 24H396" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
    <path d="M24 24H396" stroke="#f0444b" stroke-width="2" stroke-dasharray="372" stroke-dashoffset="372">
      <animate attributeName="stroke-dashoffset" values="372;0;0" keyTimes="0;.7;1" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <g font-family="monospace" font-size="10" fill="#fff" fill-opacity=".55" text-anchor="middle">
      <circle cx="24" cy="24" r="16" fill="#1b1b20" stroke="#f0444b"/><path d="M17 24l5 5 9-10" stroke="#f0444b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="58">build</text>
      <circle cx="148" cy="24" r="16" fill="#1b1b20" stroke="#f0444b"/><path d="M141 24l5 5 9-10" stroke="#f0444b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="58">test</text>
      <circle cx="272" cy="24" r="16" fill="#1b1b20" stroke="#f0444b"/><path d="M265 24l5 5 9-10" stroke="#f0444b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="272" y="58">docker</text>
      <circle cx="396" cy="24" r="16" fill="#f0444b"/><path d="M390 17l12 7-12 7z" fill="#fff"/><text x="396" y="58">deploy</text>
    </g>
  </g>

  <!-- Terminal -->
  <g transform="translate(450 60)">
    <rect width="110" height="74" rx="10" fill="#141418" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="14" cy="13" r="3" fill="#f0444b"/><circle cx="24" cy="13" r="3" fill="#fff" fill-opacity=".25"/><circle cx="34" cy="13" r="3" fill="#fff" fill-opacity=".25"/>
    <g font-family="monospace" font-size="10">
      <text x="12" y="40" fill="#f0444b">$</text><text x="22" y="40" fill="#fff" fill-opacity=".7">git push</text>
      <text x="12" y="58" fill="#f0444b">✓</text><text x="22" y="58" fill="#fff" fill-opacity=".45">deployed</text>
    </g>
    <rect x="76" y="50" width="6" height="10" fill="#fff" fill-opacity=".7"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
