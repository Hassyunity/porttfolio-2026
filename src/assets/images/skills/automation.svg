<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".12"/></pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#f0444b" stop-opacity=".32"/><stop offset="1" stop-color="#f0444b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="600" height="420" fill="#0d0d10"/>
  <rect width="600" height="420" fill="url(#g)"/>
  <rect width="600" height="420" fill="url(#glow)"/>

  <!-- Connexions du workflow -->
  <g stroke="#fff" stroke-opacity=".22" stroke-width="2">
    <path d="M136 200C180 200 180 200 224 200"/>
    <path d="M316 200C350 200 350 120 384 120"/>
    <path d="M316 200C350 200 350 280 384 280"/>
    <path d="M476 120C510 120 510 200 530 200"/>
    <path d="M476 280C510 280 510 200 530 200"/>
  </g>
  <g stroke="#f0444b" stroke-width="2.5" stroke-dasharray="8 12">
    <path d="M136 200C180 200 180 200 224 200"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M316 200C350 200 350 120 384 120"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M476 120C510 120 510 200 530 200"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- Nœud déclencheur -->
  <g transform="translate(44 154)">
    <rect width="92" height="92" rx="22" fill="#16161a" stroke="#f0444b" stroke-opacity=".75" stroke-width="2"/>
    <path d="M50 22L32 50h14l-4 22 18-30H46z" fill="#f0444b"/>
    <circle cx="92" cy="46" r="6" fill="#0d0d10" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <!-- Nœud agent IA -->
  <g transform="translate(224 154)">
    <rect width="92" height="92" rx="16" fill="#1b1b20" stroke="#f0444b" stroke-width="2"/>
    <path d="M46 20c2 14 8 20 22 22-14 2-20 8-22 22-2-14-8-20-22-22 14-2 20-8 22-22z" fill="#f0444b"/>
    <path d="M70 60c1 5 3 7 8 8-5 1-7 3-8 8-1-5-3-7-8-8 5-1 7-3 8-8z" fill="#fff" fill-opacity=".7"/>
    <circle cx="0" cy="46" r="6" fill="#0d0d10" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="92" cy="46" r="6" fill="#0d0d10" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <text x="46" y="114" font-family="monospace" font-size="11" fill="#fff" fill-opacity=".6" text-anchor="middle">AI Agent</text>
  </g>

  <!-- Nœud CRM -->
  <g transform="translate(384 74)">
    <rect width="92" height="92" rx="16" fill="#16161a" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="46" cy="38" r="12" stroke="#fff" stroke-opacity=".75" stroke-width="2.5"/>
    <path d="M24 70c4-12 12-16 22-16s18 4 22 16" stroke="#fff" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="46" r="6" fill="#0d0d10" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="92" cy="46" r="6" fill="#0d0d10" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <text x="46" y="-10" font-family="monospace" font-size="11" fill="#fff" fill-opacity=".6" text-anchor="middle">CRM</text>
  </g>

  <!-- Nœud paiement / signature -->
  <g transform="translate(384 234)">
    <rect width="92" height="92" rx="16" fill="#16161a" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <rect x="20" y="28" width="52" height="36" rx="6" stroke="#fff" stroke-opacity=".75" stroke-width="2.5"/>
    <path d="M20 40h52" stroke="#fff" stroke-opacity=".75" stroke-width="2.5"/>
    <rect x="28" y="50" width="14" height="5" rx="2.5" fill="#f0444b"/>
    <circle cx="0" cy="46" r="6" fill="#0d0d10" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="92" cy="46" r="6" fill="#0d0d10" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <text x="46" y="112" font-family="monospace" font-size="11" fill="#fff" fill-opacity=".6" text-anchor="middle">Stripe</text>
  </g>

  <!-- Fin du workflow -->
  <g transform="translate(530 176)">
    <circle cx="24" cy="24" r="24" fill="#f0444b"/>
    <path d="M13 24l7 7 15-15" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bouton exécuter -->
  <g transform="translate(44 60)">
    <rect width="150" height="36" rx="18" fill="#1b1b20" stroke="#fff" stroke-opacity=".18"/>
    <path d="M20 11l12 7-12 7z" fill="#f0444b"/>
    <text x="42" y="23" font-family="monospace" font-size="11" fill="#fff" fill-opacity=".75">Execute workflow</text>
  </g>
</svg>
