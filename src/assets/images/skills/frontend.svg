<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#fff" stroke-opacity=".05"/></pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#f0444b" stop-opacity=".35"/><stop offset="1" stop-color="#f0444b" stop-opacity="0"/></radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0444b" stop-opacity=".55"/><stop offset="1" stop-color="#f0444b" stop-opacity=".08"/></linearGradient>
  </defs>
  <rect width="600" height="420" fill="#0d0d10"/>
  <rect width="600" height="420" fill="url(#g)"/>
  <rect width="600" height="420" fill="url(#glow)"/>

  <!-- Fenêtre de navigateur -->
  <g transform="translate(70 50)">
    <rect width="380" height="270" rx="14" fill="#141418" stroke="#fff" stroke-opacity=".18"/>
    <path d="M0 14a14 14 0 0 1 14-14h352a14 14 0 0 1 14 14v18H0z" fill="#1b1b20"/>
    <circle cx="18" cy="16" r="4" fill="#f0444b"/><circle cx="32" cy="16" r="4" fill="#fff" fill-opacity=".25"/><circle cx="46" cy="16" r="4" fill="#fff" fill-opacity=".25"/>
    <rect x="80" y="9" width="220" height="14" rx="7" fill="#fff" fill-opacity=".06"/>
    <!-- Hero -->
    <rect x="20" y="50" width="340" height="96" rx="10" fill="url(#hero)"/>
    <rect x="36" y="70" width="150" height="12" rx="6" fill="#fff" fill-opacity=".85"/>
    <rect x="36" y="90" width="110" height="12" rx="6" fill="#fff" fill-opacity=".5"/>
    <rect x="36" y="116" width="70" height="18" rx="9" fill="#f0444b"/>
    <!-- Cartes -->
    <g fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12">
      <rect x="20" y="162" width="104" height="88" rx="8"/><rect x="138" y="162" width="104" height="88" rx="8"/><rect x="256" y="162" width="104" height="88" rx="8"/>
    </g>
    <g fill="#fff" fill-opacity=".3">
      <rect x="32" y="176" width="28" height="28" rx="6" fill="#f0444b" fill-opacity=".6"/><rect x="32" y="214" width="70" height="6" rx="3"/><rect x="32" y="228" width="50" height="6" rx="3"/>
      <rect x="150" y="176" width="28" height="28" rx="6"/><rect x="150" y="214" width="70" height="6" rx="3"/><rect x="150" y="228" width="50" height="6" rx="3"/>
      <rect x="268" y="176" width="28" height="28" rx="6"/><rect x="268" y="214" width="70" height="6" rx="3"/><rect x="268" y="228" width="50" height="6" rx="3"/>
    </g>
  </g>

  <!-- Mobile -->
  <g transform="translate(410 120)">
    <rect width="120" height="230" rx="18" fill="#141418" stroke="#fff" stroke-opacity=".22"/>
    <rect x="44" y="10" width="32" height="6" rx="3" fill="#fff" fill-opacity=".15"/>
    <rect x="12" y="28" width="96" height="60" rx="8" fill="url(#hero)"/>
    <rect x="12" y="100" width="70" height="8" rx="4" fill="#fff" fill-opacity=".7"/>
    <rect x="12" y="116" width="96" height="6" rx="3" fill="#fff" fill-opacity=".2"/>
    <rect x="12" y="128" width="80" height="6" rx="3" fill="#fff" fill-opacity=".2"/>
    <rect x="12" y="148" width="96" height="30" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/>
    <rect x="12" y="186" width="96" height="30" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/>
    <rect x="20" y="156" width="14" height="14" rx="4" fill="#f0444b" fill-opacity=".7"/>
  </g>

  <!-- Balise code -->
  <g transform="translate(468 52)">
    <rect width="86" height="44" rx="22" fill="#1b1b20" stroke="#f0444b" stroke-opacity=".6"/>
    <path d="M30 14l-9 8 9 8M56 14l9 8-9 8M47 11l-8 22" stroke="#f0444b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Curseur -->
  <g transform="translate(168 172)">
    <circle cx="4" cy="4" r="16" fill="#f0444b" fill-opacity=".25">
      <animate attributeName="r" values="8;22;8" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values=".4;0;.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 0l22 9-9 3-4 10z" fill="#fff" stroke="#0d0d10" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
